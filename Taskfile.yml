        vars:
          SCHEME: tetex

  mega-linter:
    desc: Run mega linter
    summary: |
      Run mega linter.

      This task will use `npx` to run `mega-linter` locally.
    interactive: true
    deps: []
    cmds:
      - npx mega-linter-runner --flavor ci_light

  pr-changelog:
    desc: Print the changelog entries for an upcoming release
    summary: |
      Print the changelog entries for an upcoming release to the console.

      Release management is handled by `cocogitto`. Whenever a new release is ready to be prepared,
      `cocogitto` creates a release branch and a new Pull Request can be started. This task can be
      used to get the changelog entries for the new version to describe the PR.
    deps: []
    cmds:
      - cog changelog HEAD..v{{.VERSION}}

  version:
    desc: Prints the project version
    summary: |
      Prints the project version.

      This task invokes `cocogitto` to retrieve the current project version and prints it to the
      console.
    deps: []
    cmds:
      - echo "LatexWorks version v{{.VERSION}}"
