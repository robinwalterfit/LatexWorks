---
# Configuration for lefthook itself
assert_lefthook_installed: true
colors: true
no_tty: false
output:
  - meta            # Print lefthook version
  - summary         # Print summary block (successful and failed steps)
  - empty_summary   # Print summary heading when there are no steps to run
  - success         # Print successful steps
  - failure         # Print failed steps printing
  - execution       # Print any execution logs (but prints if the execution failed)
  - execution_out   # Print execution output (but still prints failed commands output)
  - execution_info  # Print `EXECUTE > ...` logging
  - skips           # Print "skip" (i.e. no files matched)
source_dir: .lefthook/

# NOTE on globs:
# The glob attribute is only used if file templates are used, so we let git check if the file was changed

# Command groups
lint:
  commands:
    hadolint:
      glob: "*Dockerfile*"
      run: hadolint {staged_files}
    shellcheck:
      glob: "*.sh"
      run: shellcheck {staged_files}
  parallel: true

# format:
#   commands: {}

# Hooks
commit-msg:
  commands:
    cog-verify:
      run: cog verify --file {1}
  parallel: true

pre-commit:
  commands:
    1_lint:
      run: lefthook run lint
  # 2_format:
  #   run: lefthook run format
  #   stage_fixed: true
  piped: true

pre-push:
  commands:
    cog-check:
      run: cog check
  parallel: true
